# H2 connection
spring:
  datasource:
    url: jdbc:h2:mem:baozistoredb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 client
  h2:
    console:
      enabled: true
      path: /h2-console

  # Show SQL
  jpa:
    show-sql: true
  jpa.properties:
    hibernate:
      format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/script